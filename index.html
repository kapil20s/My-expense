<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>MyExpense</title>
  <meta name="description" content="Personal expense tracker and bill splitter. Works offline. Your data stays on this device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#edf1f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1315" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyExpense">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="js/theme.js?v=1.1.3"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css?v=1.1.3">
  <style>
    .boot { text-align: center; padding: 72px 20px; color: #64748b; font: 15px/1.5 -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", sans-serif; }
    .boot-spin { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid #cbd5e1; border-top-color: #0f766e; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
    .boot-help { opacity: 0; max-width: 34ch; margin: 14px auto 0; font-size: 13.5px; animation: boot-show 0.3s 8s forwards; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-show { to { opacity: 1; } }
  </style>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header id="topbar" class="topbar"><h1>MyExpense</h1></header>
  <main id="app" tabindex="-1"><div id="view"><div class="boot" role="status"><div class="boot-spin" aria-hidden="true"></div><p>Loading your data…</p><p class="boot-help">This is taking too long. Connect to the internet and reload once. If it still stays here, the app files were not uploaded completely: check that the <b>js</b> and <b>css</b> folders exist in your GitHub repository.</p></div></div></main>
  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a.8.8 0 0 1-.8.8H15v-6H9v6H4.3a.8.8 0 0 1-.8-.8z"/></svg><span>Home</span></a>
    <a href="#/transactions" data-tab="transactions"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg><span>Transactions</span></a>
    <button type="button" class="nav-add" data-action="quick-add" aria-label="Add expense, income, split or payment"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#/split" data-tab="split"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 20c.6-3.4 3.1-5.6 6-5.6s5.4 2.2 6 5.6"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.3 14.4c2.6.2 4.4 2.3 4.9 5.6"/></svg><span>Split</span></a>
    <a href="#/reports" data-tab="reports"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M10.5 20V5M16 20v-6M21.5 20h-19"/></svg><span>Reports</span></a>
  </nav>
  <div id="update-banner" class="update-banner" role="status" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">MyExpense needs JavaScript to run.</p></noscript>
  <script src="js/core.js?v=1.1.3"></script>
  <script src="js/db.js?v=1.1.3"></script>
  <script src="js/app.js?v=1.1.3"></script>
</body>
</html>
